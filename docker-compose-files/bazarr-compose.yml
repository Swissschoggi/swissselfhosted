---
services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /srv/bazarr/config:/config
      - /Media/Movie:/movies #optional
      - /Media/Series:/tv #optional
    ports:
      - 6767:6767
    restart: unless-stopped
