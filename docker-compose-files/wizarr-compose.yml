---
services:
  wizarr:
    container_name: wizarr
    image: ghcr.io/wizarrrr/wizarr
    ports:
      - 5690:5690
    volumes:
      - /srv/wizarr/database:/data
    environment:
      - PUID=1000 #Set UID
      - PGID=1000 #Set GID
      - DISABLE_BUILTIN_AUTH=true #Set to true ONLY if you are using another auth provider (Authelia, Authentik, etc)
      - TZ=Europe/Berlin #Set your timezone here
    security_opt:
      - apparmor:unconfined
